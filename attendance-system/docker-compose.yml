version: '3.8'

services:
  # ========== POSTGRESQL (БД) ==========
  postgres:
    image: postgres:15-alpine
    container_name: attendance-postgres
    environment:
      POSTGRES_DB: test3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-network

  # ========== JAVA BACKEND ==========
  java-backend:
    build: ./java-backend
    container_name: attendance-java
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/test3
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendance-network

  # ========== PYTHON FACE RECOGNITION ==========
  python-face:
    build: ./python-face
    container_name: attendance-python
    environment:
      JAVA_BACKEND_HOST: java-backend
      JAVA_BACKEND_PORT: 8080
      TAPO_USERNAME: TapoCamera
      TAPO_PASSWORD: TapoCamera11
      TAPO_IP: 172.20.10.2
    ports:
      - "8001:8001"
    networks:
      - attendance-network

  # ========== REACT FRONTEND ==========
  react-frontend:
    build: ./react-frontend
    container_name: attendance-frontend
    ports:
      - "3000:80"
    depends_on:
      - java-backend
    networks:
      - attendance-network

networks:
  attendance-network:
    driver: bridge

volumes:
  postgres_data: